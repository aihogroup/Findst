<!doctype html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="{{site.themeColorLight}}">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{site.name}}">

  <!-- Open Graph & pratinjau tautan -->
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:locale" content="{{site.locale}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site.url}}{{site.ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Findst — manajemen investasi saham Indonesia dengan dynamic threshold">
  <meta name="twitter:card" content="summary_large_image">

  {{#if fontPreload}}<link rel="preload" href="/fonts/source-serif-4-latin-wght.woff2" as="font" type="font/woff2" crossorigin>{{/if}}
  <link rel="modulepreload" href="{{asset}}/js/main.js">

  <style>{{{criticalCss}}}</style>
  {{#unless page.asyncCss}}<link rel="stylesheet" href="{{mainCss}}">{{#if pageCss}}<link rel="stylesheet" href="{{pageCss}}">{{/if}}{{/unless}}
  <script data-css="{{asyncMainCss}}" data-page-css="{{asyncPageCss}}">{{> boot.js}}</script>
  {{#if page.asyncCss}}<noscript><link rel="stylesheet" href="{{mainCss}}">{{#if pageCss}}<link rel="stylesheet" href="{{pageCss}}">{{/if}}</noscript>{{/if}}
  <script type="module" src="{{asset}}/js/main.js"></script>
  {{{jsonLd}}}
</head>
